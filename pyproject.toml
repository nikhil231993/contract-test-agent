[project]
name = "contract-test-agent"
version = "0.1.0"
description = "An AI agent that writes Specmatic consumer contract tests for a Java Spring service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    # The Claude Code harness as a library: file and shell tools, MCP client, permissions, hooks.
    # Pinned to a release that had two weeks in the wild; bump deliberately.
    "claude-agent-sdk==0.2.163",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
contract-agent = "contract_test_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_test_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
